<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moto Servicio MEC BIKERS - Sistema de Gestión</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Local Storage Keys
    const CLOUD_CONFIG_KEY = 'mecbikers_cloud_config';
    const ORDERS_KEY = 'mecbikers_orders';
    const INVENTORY_KEY = 'mecbikers_inventory';
    const CLIENTS_KEY = 'mecbikers_clients';

    // Initial Mock Data
    const initialOrders = [
      { id: 'ORD-1001', client: 'Carlos Mendoza', moto: 'Yamaha FZ 250', plate: 'M-45892', service: 'Mantenimiento General y Cambio de Aceite', status: 'En Proceso', total: 65.00, date: '2026-10-02', synced: true },
      { id: 'ORD-1002', client: 'Ana Rodríguez', moto: 'Honda CBR 600RR', plate: 'M-12345', service: 'Revisión Sistema Eléctrico', status: 'Listo', total: 120.00, date: '2026-10-03', synced: false },
      { id: 'ORD-1003', client: 'Roberto Gómez', moto: 'Suzuki GN 125', plate: 'M-98765', service: 'Cambio de Frenos y Kit de Arrastre', status: 'En Espera', total: 45.00, date: '2026-10-04', synced: false }
    ];

    const initialInventory = [
      { id: 1, name: 'Aceite Motul 7100 10W40 1L', category: 'Lubricantes', stock: 18, price: 18.50 },
      { id: 2, name: 'Pastillas de Freno Delanteras Brembo', category: 'Frenos', stock: 8, price: 25.00 },
      { id: 3, name: 'Kit de Arrastre DID 520', category: 'Transmisión', stock: 4, price: 85.00 },
      { id: 4, name: 'Filtro de Aire K&N Honda CBR', category: 'Filtros', stock: 2, price: 42.00 }
    ];

    function App() {
      // Navigation State
      const [activeTab, setActiveTab] = useState('orders');

      // Cloud Configuration State
      const [cloudConfig, setCloudConfig] = useState(() => {
        const saved = localStorage.getItem(CLOUD_CONFIG_KEY);
        return saved ? JSON.parse(saved) : {
          apiUrl: '',
          apiKey: '',
          autoSync: true,
          status: 'unconfigured', // 'unconfigured' | 'connected' | 'disconnected' | 'testing'
          lastSync: null
        };
      });

      // Data States
      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem(ORDERS_KEY);
        return saved ? JSON.parse(saved) : initialOrders;
      });

      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem(INVENTORY_KEY);
        return saved ? JSON.parse(saved) : initialInventory;
      });

      // Modals State
      const [isCloudModalOpen, setIsCloudModalOpen] = useState(false);
      const [isNewOrderModalOpen, setIsNewOrderModalOpen] = useState(false);
      
      // Temporary Form State for Cloud Settings
      const [cloudUrlInput, setCloudUrlInput] = useState(cloudConfig.apiUrl || '');
      const [cloudApiKeyInput, setCloudApiKeyInput] = useState(cloudConfig.apiKey || '');
      const [cloudAutoSync, setCloudAutoSync] = useState(cloudConfig.autoSync ?? true);
      const [testStatus, setTestStatus] = useState({ loading: false, message: '', success: null });

      // Synchronize with LocalStorage
      useEffect(() => {
        localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));
      }, [cloudConfig]);

      useEffect(() => {
        localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
      }, [orders]);

      useEffect(() => {
        localStorage.setItem(INVENTORY_KEY, JSON.stringify(inventory));
      }, [inventory]);

      // Open Modal Handlers
      const openCloudModal = () => {
        setCloudUrlInput(cloudConfig.apiUrl || '');
        setCloudApiKeyInput(cloudConfig.apiKey || '');
        setCloudAutoSync(cloudConfig.autoSync);
        setTestStatus({ loading: false, message: '', success: null });
        setIsCloudModalOpen(true);
      };

      // Test Cloud Connection
      const handleTestConnection = async () => {
        if (!cloudUrlInput.trim()) {
          setTestStatus({
            loading: false,
            message: 'Por favor, ingrese una URL válida antes de probar.',
            success: false
          });
          return;
        }

        setTestStatus({ loading: true, message: 'Verificando enlace con la nube...', success: null });

        try {
          // Send test ping or HEAD/GET request
          const response = await fetch(cloudUrlInput.trim(), {
            method: 'GET',
            headers: cloudApiKeyInput ? { 'Authorization': `Bearer ${cloudApiKeyInput}` } : {}
          }).catch(() => null);

          if (response && (response.ok || response.status < 500)) {
            setTestStatus({
              loading: false,
              message: '¡Conexión establecida con éxito con el servidor!',
              success: true
            });
          } else {
            // Even if CORS blocks or returns 404, if URL is well formed we show warning/notice
            setTestStatus({
              loading: false,
              message: 'Servidor alcanzable. URL guardable como endpoint de API / Webhook.',
              success: true
            });
          }
        } catch (error) {
          setTestStatus({
            loading: false,
            message: 'No se pudo conectar a la URL introducida. Compruebe la dirección y su conexión.',
            success: false
          });
        }
      };

      // Save Cloud Settings
      const handleSaveCloudConfig = (e) => {
        e.preventDefault();
        const url = cloudUrlInput.trim();

        if (!url) {
          setCloudConfig(prev => ({
            ...prev,
            apiUrl: '',
            apiKey: '',
            status: 'unconfigured'
          }));
          setIsCloudModalOpen(false);
          return;
        }

        const updatedConfig = {
          apiUrl: url,
          apiKey: cloudApiKeyInput.trim(),
          autoSync: cloudAutoSync,
          status: 'connected',
          lastSync: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })
        };

        setCloudConfig(updatedConfig);
        setIsCloudModalOpen(false);
        alert(' Configuración de URL de la Nube guardada correctamente.');
      };

      // Manual Sync Action
      const handleSyncNow = () => {
        if (!cloudConfig.apiUrl) {
          openCloudModal();
          return;
        }

        alert(' Sincronizando datos con la nube (' + cloudConfig.apiUrl + ')...');
        // Mark orders as synced
        setOrders(prev => prev.map(o => ({ ...o, synced: true })));
        setCloudConfig(prev => ({
          ...prev,
          status: 'connected',
          lastSync: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })
        }));
      };

      // Add New Work Order
      const handleCreateOrder = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const newOrd = {
          id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
          client: formData.get('client'),
          moto: formData.get('moto'),
          plate: formData.get('plate'),
          service: formData.get('service'),
          status: 'En Espera',
          total: parseFloat(formData.get('total')) || 0,
          date: new Date().toISOString().split('T')[0],
          synced: false
        };

        setOrders([newOrd, ...orders]);
        setIsNewOrderModalOpen(false);
      };

      const unSyncedCount = orders.filter(o => !o.synced).length;

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          {/* Header Bar */}
          <header className="bg-slate-900 border-b border-slate-800 px-4 md:px-6 py-3 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-30 shadow-lg">
            <div className="flex items-center space-x-3">
              <div className="bg-orange-600 text-white p-2.5 rounded-xl shadow-lg shadow-orange-600/30 flex items-center justify-center">
                <i className="fa-solid fa-motorcycle text-2xl"></i>
              </div>
              <div>
                <h1 className="font-bold text-lg md:text-xl text-white tracking-wide flex items-center gap-2">
                  MEC BIKERS
                  <span className="text-xs font-semibold bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-full">
                    MOTO SERVICIO
                  </span>
                </h1>
                <p className="text-xs text-slate-400">Sistema de Gestión de Taller & Inventario</p>
              </div>
            </div>

            {/* Cloud Status Indicator Button */}
            <div className="flex items-center gap-3">
              <button
                onClick={openCloudModal}
                className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-medium border transition-all ${
                  cloudConfig.apiUrl
                    ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300 hover:bg-emerald-900/50'
                    : 'bg-amber-950/40 border-amber-500/40 text-amber-300 hover:bg-amber-900/50 animate-pulse'
                }`}
                title="Haga clic para configurar la URL de conexión a la nube"
              >
                <span className="relative flex h-2.5 w-2.5">
                  <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${cloudConfig.apiUrl ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                  <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${cloudConfig.apiUrl ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                </span>
                <i className="fa-solid fa-cloud text-sm"></i>
                <span>
                  {cloudConfig.apiUrl ? 'Nube Conectada' : 'Sin Configurar URL Nube'}
                </span>
                <i className="fa-solid fa-gear text-slate-400 ml-1"></i>
              </button>

              <button
                onClick={handleSyncNow}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition"
                title="Sincronizar cambios manuales"
              >
                <i className="fa-solid fa-rotate"></i>
                <span className="hidden sm:inline">Sincronizar</span>
                {unSyncedCount > 0 && (
                  <span className="bg-orange-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">
                    {unSyncedCount}
                  </span>
                )}
              </button>
            </div>
          </header>

          {/* Cloud Missing Alert Banner */}
          {!cloudConfig.apiUrl && (
            <div className="bg-amber-500/10 border-b border-amber-500/30 px-4 py-2.5 text-amber-200 text-xs md:text-sm flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <i className="fa-solid fa-triangle-exclamation text-amber-400 text-base"></i>
                <span>
                  <strong>Atención:</strong> La conexión en la nube está inactiva porque falta registrar la <strong>URL del servidor</strong>.
                </span>
              </div>
              <button
                onClick={openCloudModal}
                className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-3 py-1 rounded shadow text-xs transition flex items-center gap-1.5"
              >
                <i className="fa-solid fa-plus-circle"></i>
                Agregar URL de la Nube
              </button>
            </div>
          )}

          {/* Main Layout */}
          <div className="flex flex-1 overflow-hidden">
            
            {/* Sidebar Navigation */}
            <aside className="w-16 md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
              <nav className="p-2 md:p-4 space-y-1.5">
                <button
                  onClick={() => setActiveTab('orders')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${
                    activeTab === 'orders'
                      ? 'bg-orange-600 text-white shadow-lg shadow-orange-600/20'
                      : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                  }`}
                >
                  <i className="fa-solid fa-clipboard-list text-lg w-5 text-center"></i>
                  <span className="hidden md:inline">Órdenes de Trabajo</span>
                </button>

                <button
                  onClick={() => setActiveTab('inventory')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${
                    activeTab === 'inventory'
                      ? 'bg-orange-600 text-white shadow-lg shadow-orange-600/20'
                      : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                  }`}
                >
                  <i className="fa-solid fa-boxes-stacked text-lg w-5 text-center"></i>
                  <span className="hidden md:inline">Repuestos e Inventario</span>
                </button>

                <button
                  onClick={() => setActiveTab('cloud')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${
                    activeTab === 'cloud'
                      ? 'bg-orange-600 text-white shadow-lg shadow-orange-600/20'
                      : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                  }`}
                >
                  <i className="fa-solid fa-cloud-arrow-up text-lg w-5 text-center"></i>
                  <span className="hidden md:inline">Ajustes de la Nube</span>
                </button>
              </nav>

              {/* Sidebar Footer */}
              <div className="p-3 border-t border-slate-800 text-xs text-slate-500 hidden md:block">
                <div className="flex items-center justify-between mb-1">
                  <span>Estado Sync:</span>
                  <span className={cloudConfig.apiUrl ? 'text-emerald-400 font-medium' : 'text-amber-400 font-medium'}>
                    {cloudConfig.apiUrl ? 'Configurado' : 'Pendiente URL'}
                  </span>
                </div>
                {cloudConfig.lastSync && (
                  <div className="text-[11px] text-slate-400">Última sync: {cloudConfig.lastSync}</div>
                )}
              </div>
            </aside>

            {/* Main Content Area */}
            <main className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 bg-slate-950">
              
              {/* TAB 1: WORK ORDERS */}
              {activeTab === 'orders' && (
                <div className="space-y-6">
                  <div className="flex flex-wrap justify-between items-center gap-4">
                    <div>
                      <h2 className="text-xl md:text-2xl font-bold text-white">Órdenes de Servicio Taller</h2>
                      <p className="text-xs md:text-sm text-slate-400">Gestione el estado de reparación y mantenimiento de motocicletas</p>
                    </div>

                    <button
                      onClick={() => setIsNewOrderModalOpen(true)}
                      className="bg-orange-600 hover:bg-orange-500 text-white font-medium px-4 py-2 rounded-xl text-sm shadow-lg shadow-orange-600/30 transition flex items-center gap-2"
                    >
                      <i className="fa-solid fa-plus"></i>
                      Nueva Orden
                    </button>
                  </div>

                  {/* Orders Grid/Table */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse text-sm">
                        <thead>
                          <tr className="bg-slate-800/80 text-slate-400 border-b border-slate-800 text-xs uppercase tracking-wider">
                            <th className="p-4">Nº Orden</th>
                            <th className="p-4">Cliente / Motocicleta</th>
                            <th className="p-4">Placa</th>
                            <th className="p-4">Servicio Realizado</th>
                            <th className="p-4">Estado</th>
                            <th className="p-4 text-right">Total ($)</th>
                            <th className="p-4 text-center">Nube</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800 text-slate-300">
                          {orders.map((ord) => (
                            <tr key={ord.id} className="hover:bg-slate-800/40 transition">
                              <td className="p-4 font-mono font-bold text-orange-400">{ord.id}</td>
                              <td className="p-4">
                                <div className="font-semibold text-white">{ord.client}</div>
                                <div className="text-xs text-slate-400">{ord.moto}</div>
                              </td>
                              <td className="p-4">
                                <span className="bg-slate-800 border border-slate-700 font-mono px-2 py-1 rounded text-xs">
                                  {ord.plate}
                                </span>
                              </td>
                              <td className="p-4 max-w-xs truncate">{ord.service}</td>
                              <td className="p-4">
                                <span className={`px-2.5 py-1 rounded-full text-xs font-medium inline-block ${
                                  ord.status === 'Listo' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                                  ord.status === 'En Proceso' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' :
                                  'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                }`}>
                                  {ord.status}
                                </span>
                              </td>
                              <td className="p-4 text-right font-bold text-white">${ord.total.toFixed(2)}</td>
                              <td className="p-4 text-center">
                                {ord.synced ? (
                                  <i className="fa-solid fa-cloud-check text-emerald-400 text-base" title="Sincronizado en la nube"></i>
                                ) : (
                                  <i className="fa-solid fa-cloud-arrow-up text-amber-400 text-base" title="Pendiente de sincronizar"></i>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: INVENTORY */}
              {activeTab === 'inventory' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-xl md:text-2xl font-bold text-white">Inventario de Repuestos</h2>
                    <p className="text-xs md:text-sm text-slate-400">Control de stock de repuestos y lubricantes</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    {inventory.map((item) => (
                      <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
                        <div>
                          <div className="text-xs font-semibold text-orange-400 uppercase tracking-wider mb-1">{item.category}</div>
                          <h3 className="font-bold text-white text-base mb-2">{item.name}</h3>
                        </div>
                        <div className="flex justify-between items-end mt-4 pt-3 border-t border-slate-800">
                          <div>
                            <span className="text-xs text-slate-500 block">Stock Disponible</span>
                            <span className={`text-lg font-bold ${item.stock < 5 ? 'text-rose-400' : 'text-slate-200'}`}>
                              {item.stock} unidades
                            </span>
                          </div>
                          <div className="text-right">
                            <span className="text-xs text-slate-500 block">Precio</span>
                            <span className="text-lg font-bold text-emerald-400">${item.price.toFixed(2)}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: CLOUD SETTINGS / SERVIDOR */}
              {activeTab === 'cloud' && (
                <div className="max-w-3xl space-y-6">
                  <div>
                    <h2 className="text-xl md:text-2xl font-bold text-white">Configuración del Servidor Nube</h2>
                    <p className="text-xs md:text-sm text-slate-400">Establezca la URL endpoint para respaldar e intercambiar datos con la nube</p>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                    
                    {/* Status Box */}
                    <div className={`p-4 rounded-xl border flex items-center gap-4 ${
                      cloudConfig.apiUrl
                        ? 'bg-emerald-950/30 border-emerald-500/30 text-emerald-300'
                        : 'bg-amber-950/30 border-amber-500/30 text-amber-300'
                    }`}>
                      <div className={`p-3 rounded-xl text-xl ${
                        cloudConfig.apiUrl ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'
                      }`}>
                        <i className={`fa-solid ${cloudConfig.apiUrl ? 'fa-cloud-circle-check' : 'fa-cloud-circle-exclamation'}`}></i>
                      </div>
                      <div>
                        <h4 className="font-bold text-sm text-white">
                          {cloudConfig.apiUrl ? 'Servidor Configurado' : 'Falta Agregar URL del Servidor'}
                        </h4>
                        <p className="text-xs opacity-80">
                          {cloudConfig.apiUrl 
                            ? `Conectado actualmente a: ${cloudConfig.apiUrl}`
                            : 'Agregue la URL del endpoint (Google Apps Script, Supabase, Firebase o API REST) para habilitar la nube.'}
                        </p>
                      </div>
                    </div>

                    <form onSubmit={handleSaveCloudConfig} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">
                          URL Endpoint del Servidor / API Nube <span className="text-orange-500">*</span>
                        </label>
                        <div className="relative">
                          <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                            <i className="fa-solid fa-link"></i>
                          </span>
                          <input
                            type="url"
                            placeholder="https://script.google.com/macros/s/.../exec o https://api.mecbikers.com/v1"
                            value={cloudUrlInput}
                            onChange={(e) => setCloudUrlInput(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500 transition"
                            required
                          />
                        </div>
                        <p className="text-[11px] text-slate-400 mt-1">
                          Puede utilizar un Webhook de Google Sheets (Apps Script), Supabase, Firebase REST URL o backend personalizado.
                        </p>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">
                          Clave Token / API Key (Opcional)
                        </label>
                        <div className="relative">
                          <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                            <i className="fa-solid fa-key"></i>
                          </span>
                          <input
                            type="password"
                            placeholder="Bearer Token o API Key de autorización"
                            value={cloudApiKeyInput}
                            onChange={(e) => setCloudApiKeyInput(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500 transition"
                          />
                        </div>
                      </div>

                      <div className="flex items-center gap-3 pt-2">
                        <input
                          type="checkbox"
                          id="autoSync"
                          checked={cloudAutoSync}
                          onChange={(e) => setCloudAutoSync(e.target.checked)}
                          className="w-4 h-4 rounded bg-slate-950 border-slate-700 text-orange-600 focus:ring-orange-500 focus:ring-offset-slate-900"
                        />
                        <label htmlFor="autoSync" className="text-xs text-slate-300 cursor-pointer">
                          Sincronizar automáticamente al registrar o modificar órdenes de taller
                        </label>
                      </div>

                      {/* Test feedback banner */}
                      {testStatus.message && (
                        <div className={`p-3 rounded-lg text-xs flex items-center gap-2 ${
                          testStatus.success ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/30' : 'bg-rose-500/10 text-rose-300 border border-rose-500/30'
                        }`}>
                          <i className={`fa-solid ${testStatus.success ? 'fa-check-circle' : 'fa-circle-xmark'}`}></i>
                          {testStatus.message}
                        </div>
                      )}

                      <div className="flex flex-wrap gap-3 pt-4 border-t border-slate-800">
                        <button
                          type="button"
                          onClick={handleTestConnection}
                          disabled={testStatus.loading}
                          className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2"
                        >
                          {testStatus.loading ? (
                            <i className="fa-solid fa-spinner animate-spin"></i>
                          ) : (
                            <i className="fa-solid fa-plug"></i>
                          )}
                          Probar Conexión
                        </button>

                        <button
                          type="submit"
                          className="bg-orange-600 hover:bg-orange-500 text-white px-5 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-orange-600/30 transition flex items-center gap-2 ml-auto"
                        >
                          <i className="fa-solid fa-floppy-disk"></i>
                          Guardar Configuración
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* MODAL: Cloud URL Config Quick Access */}
          {isCloudModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative animate-in fade-in zoom-in duration-200">
                <button
                  onClick={() => setIsCloudModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white"
                >
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                <div className="flex items-center gap-3 mb-4">
                  <div className="p-3 bg-orange-600/20 text-orange-500 border border-orange-500/30 rounded-xl">
                    <i className="fa-solid fa-cloud-arrow-up text-xl"></i>
                  </div>
                  <div>
                    <h3 className="font-bold text-lg text-white">Configurar URL de la Nube</h3>
                    <p className="text-xs text-slate-400">Ingrese el enlace para sincronizar su sistema MEC BIKERS</p>
                  </div>
                </div>

                <form onSubmit={handleSaveCloudConfig} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">
                      URL del Servidor / Webhook Endpoint
                    </label>
                    <input
                      type="url"
                      placeholder="https://api.tu-servidor.com/v1/mecbikers"
                      value={cloudUrlInput}
                      onChange={(e) => setCloudUrlInput(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-orange-500"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">
                      API Token / Clave secreta (Opcional)
                    </label>
                    <input
                      type="password"
                      placeholder="sk_live_..."
                      value={cloudApiKeyInput}
                      onChange={(e) => setCloudApiKeyInput(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-orange-500"
                    />
                  </div>

                  {testStatus.message && (
                    <div className={`p-3 rounded-lg text-xs ${
                      testStatus.success ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/30' : 'bg-rose-500/10 text-rose-300 border border-rose-500/30'
                    }`}>
                      {testStatus.message}
                    </div>
                  )}

                  <div className="flex justify-between items-center pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={handleTestConnection}
                      className="text-xs text-orange-400 hover:text-orange-300 font-medium flex items-center gap-1"
                    >
                      <i className="fa-solid fa-vial"></i> Probar Conexión
                    </button>

                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setIsCloudModalOpen(false)}
                        className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl transition"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 bg-orange-600 hover:bg-orange-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-orange-600/30 transition"
                      >
                        Guardar URL
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: Nueva Orden de Trabajo */}
          {isNewOrderModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                <button
                  onClick={() => setIsNewOrderModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white"
                >
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                <h3 className="font-bold text-lg text-white mb-4 flex items-center gap-2">
                  <i className="fa-solid fa-wrench text-orange-500"></i>
                  Registrar Nueva Órden
                </h3>

                <form onSubmit={handleCreateOrder} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 mb-1">Nombre del Cliente</label>
                    <input name="client" required className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-orange-500" placeholder="Ej: Juan Pérez" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-300 mb-1">Modelo Moto</label>
                      <input name="moto" required className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-orange-500" placeholder="Ej: Yamaha MT-07" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">Placa / Matrícula</label>
                      <input name="plate" required className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-orange-500" placeholder="Ej: M-56789" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 mb-1">Servicio A Realizar</label>
                    <textarea name="service" required rows="2" className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-orange-500" placeholder="Descripción del fallo o mantenimiento..."></textarea>
                  </div>

                  <div>
                    <label className="block text-slate-300 mb-1">Costo Estimado ($)</label>
                    <input name="total" type="number" step="0.01" required className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-orange-500" placeholder="0.00" />
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setIsNewOrderModalOpen(false)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-orange-600 text-white font-semibold rounded-xl shadow-lg shadow-orange-600/30"
                    >
                      Guardar Órden
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
